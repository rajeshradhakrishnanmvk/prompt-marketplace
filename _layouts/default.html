<!DOCTYPE html>
<html lang="en" data-base="{{ site.baseurl }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.seo_title %}{{ page.seo_title }}{% elsif page.title %}{{ page.title }} · Foldly{% else %}Foldly — Paint a square. Watch it fold.{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <meta property="og:title" content="{% if page.seo_title %}{{ page.seo_title }}{% elsif page.title %}{{ page.title }}{% else %}Foldly{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="{% if page.collection == 'models' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.seo_title %}{{ page.seo_title }}{% elsif page.title %}{{ page.title }} · Foldly{% else %}Foldly — Paint a square. Watch it fold.{% endif %}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/og.png">
  <meta name="theme-color" content="#243056">
  {% if page.robots %}<meta name="robots" content="{{ page.robots }}">{% endif %}
  <link rel="icon" href="{{ site.baseurl }}/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/site.css">
  {% if page.collection == 'models' %}
  {% assign howto = site.data.models[page.model_id] %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "HowTo",
    "name": {{ page.seo_title | jsonify }},
    "description": {{ page.description | jsonify }},
    "totalTime": {{ page.total_time | jsonify }},
    "supply": [{ "@type": "HowToSupply", "name": {{ page.materials | jsonify }} }],
    {% assign paper_tool = page.paper_tool | default: "One square of paper" %}
    "tool": [{ "@type": "HowToTool", "name": {{ paper_tool | jsonify }} }],
    "step": [
      {% for step in page.steps %}
      {% if step.tip %}{% capture howto_text %}{{ step.text }} {{ step.tip }}{% endcapture %}{% else %}{% assign howto_text = step.text %}{% endif %}
      {
        "@type": "HowToStep",
        "position": {{ forloop.index }},
        "name": {{ step.text | jsonify }},
        "text": {{ howto_text | jsonify }}
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ]
  }
  </script>
  {% endif %}
</head>
<body class="{{ page.body_class }}" {% if page.model_id %}data-model="{{ page.model_id }}"{% endif %}>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  {% if page.needs_models or page.collection == 'models' %}
  <script type="application/json" id="foldly-models">{{ site.data.models | jsonify }}</script>
  {% endif %}
</body>
</html>
