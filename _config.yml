title: Prompt Marketplace
description: A public feed of reusable prompts you can copy, like, and contribute.
url: https://rajeshradhakrishnanmvk.github.io
baseurl: /prompt-marketplace
timezone: UTC
markdown: kramdown
permalink: pretty
excerpt_separator: "<!--more-->"
prompt_repo: rajeshradhakrishnanmvk/prompt-marketplace
prompt_branch: main

collections:
  prompts:
    output: true
    permalink: /prompts/:slug/

defaults:
  - scope:
      path: ""
      type: prompts
    values:
      layout: prompt

exclude:
  - README.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - node_modules
