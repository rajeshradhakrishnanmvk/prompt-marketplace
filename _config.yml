title: Foldly
description: Paint a square. Watch it fold.
url: https://rajeshradhakrishnanmvk.github.io
baseurl: /prompt-marketplace
timezone: UTC
markdown: kramdown
permalink: pretty

collections:
  models:
    output: true
    permalink: /models/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: models
    values:
      layout: model

exclude:
  - README.md
  - tools
  - vendor
  - Gemfile
  - Gemfile.lock
  - node_modules
  - .bundle
